<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tepux — Arquitectura y flujos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
<style>
  :root{
    --carbon:#131316; --carbon-2:#1A1B20; --carbon-3:#202127; --paper:#FFFFFF;
    --line:rgba(255,255,255,0.09); --line-2:rgba(255,255,255,0.14);
    --line-soft:rgba(0,0,0,0.1); --muted:#8D8D96; --muted-dark:#6B6B70;
    --accent:#FFC300; --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--carbon);color:#fff;
       -webkit-font-smoothing:antialiased;}

  .shell{display:flex;min-height:100vh;}

  aside{width:264px;flex-shrink:0;background:var(--carbon-2);border-right:1px solid var(--line);
        padding:26px 0 26px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  aside .brand{padding:0 24px 20px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  aside .brand .k{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;color:var(--accent);
                  text-transform:uppercase;}
  aside .brand h1{font-size:18px;margin:6px 0 0;font-weight:600;letter-spacing:-0.2px;}

  .group{margin-bottom:24px;}
  .group .gh{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;color:var(--muted);
             text-transform:uppercase;padding:0 24px;margin-bottom:10px;}
  .group button{display:flex;align-items:center;justify-content:space-between;gap:8px;
      width:calc(100% - 16px);margin:0 8px 2px;text-align:left;appearance:none;border:none;
      background:none;border-radius:7px;padding:8px 14px;font-size:13px;color:var(--muted);
      cursor:pointer;font-family:var(--sans);}
  .group button .cnt{font-family:var(--mono);font-size:10px;color:var(--muted-dark);}
  .group button:hover{color:#fff;background:rgba(255,255,255,0.045);}
  .group button.active{color:#fff;background:rgba(255,195,0,0.11);font-weight:600;}
  .group button.active .cnt{color:var(--accent);}

  main{flex:1;padding:48px 52px 90px;max-width:960px;}
  section{display:none;}
  section.active{display:block;}
  section .kicker{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:var(--accent);
                  text-transform:uppercase;margin-bottom:10px;}
  section h2{font-size:26px;margin:0 0 8px;font-weight:600;letter-spacing:-0.3px;}
  section .desc{color:var(--muted);font-size:14px;margin:0 0 30px;max-width:580px;line-height:1.6;}

  .card{background:var(--paper);color:#15161A;border:1px solid var(--line-2);border-radius:10px;
        padding:22px;margin-bottom:18px;}
  .card h3{font-family:var(--mono);font-size:11.5px;margin:0;color:var(--muted-dark);
           text-transform:uppercase;letter-spacing:0.6px;font-weight:500;}
  .card .note{font-size:12px;color:var(--muted-dark);margin-top:14px;border-top:1px solid var(--line-soft);
              padding-top:12px;}
  .mermaid{display:flex;justify-content:center;}

  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
             margin-bottom:14px;flex-wrap:wrap;}

  .toolbar{display:flex;align-items:stretch;gap:0;flex-shrink:0;border:1px solid var(--line-soft);
      border-radius:7px;overflow:hidden;background:#FAFAF7;}
  .toolbar button{appearance:none;border:none;border-right:1px solid var(--line-soft);
      background:transparent;color:#15161A;width:28px;height:26px;font-size:14px;
      cursor:pointer;line-height:1;font-family:var(--sans);display:flex;align-items:center;justify-content:center;}
  .toolbar button:last-child{border-right:none;}
  .toolbar button:hover{background:#EFEEE8;}
  .toolbar .lvl{font-family:var(--mono);font-size:10.5px;color:var(--muted-dark);width:42px;
      text-align:center;display:flex;align-items:center;justify-content:center;
      border-right:1px solid var(--line-soft);background:#FAFAF7;flex-shrink:0;}
  .toolbar .fit-btn,.toolbar .fs-btn{width:auto;padding:0 10px;font-size:10.5px;font-family:var(--mono);
      letter-spacing:0.2px;}

  .viewport{position:relative;overflow:hidden;background:
      radial-gradient(circle, rgba(0,0,0,0.08) 1px, transparent 1px) 0 0/16px 16px, #FDFDFB;
      border:1px solid var(--line-soft);border-radius:7px;height:340px;cursor:grab;touch-action:none;}
  .viewport.dragging{cursor:grabbing;}
  .stage{position:absolute;top:0;left:0;transform-origin:0 0;display:inline-block;}
  .stage .mermaid{display:block;}

  .card.expanded{position:fixed;inset:22px;z-index:999;margin:0;display:flex;flex-direction:column;
      border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,0.5), 0 0 0 2000px rgba(9,9,11,0.82);}
  .card.expanded .viewport{flex:1;height:auto;}
  body.has-expanded{overflow:hidden;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-soft);}
  th{font-family:var(--mono);color:var(--muted-dark);font-weight:500;font-size:10.5px;
     text-transform:uppercase;letter-spacing:0.5px;}
  tr:last-child td{border-bottom:none;}

  footer{padding:0 52px 40px;color:var(--muted-dark);font-family:var(--mono);font-size:11px;}

  @media (max-width: 820px){
    .shell{flex-direction:column;}
    aside{width:100%;height:auto;position:relative;padding:18px 0;}
    main{padding:30px 22px 70px;}
  }
</style>
</head>

const groups = ['App','Landing','Sistema'];
const sidebarEl = document.getElementById('sidebar');
const panelsEl = document.getElementById('panels');

groups.forEach(g => {
  const gdiv = document.createElement('div');
  gdiv.className = 'group';
  gdiv.innerHTML = `<div class="gh">${g}</div>`;
  sections.filter(s => s.group === g).forEach((s, idx) => {
    const btn = document.createElement('button');
    const total = (s.cards||[]).length + (s.tables||[]).length;
    btn.innerHTML = `<span>${s.label}</span><span class="cnt">${total}</span>`;
    btn.dataset.target = s.id;
    if (g === groups[0] && idx === 0) btn.classList.add('active');
    btn.onclick = () => activate(s.id);
    gdiv.appendChild(btn);
  });
  sidebarEl.appendChild(gdiv);
});

sections.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.id = s.id;
  if (i === 0) sec.classList.add('active');
  let html = `<div class="kicker">${s.kicker}</div><h2>${s.title}</h2><p class="desc">${s.desc}</p>`;
  (s.cards||[]).forEach((c, ci) => {
    const cardId = `${s.id}-c${ci}`;
    html += `<div class="card" id="${cardId}">
      <div class="card-head">
        <h3>${c.h}</h3>
        <div class="toolbar">
          <button data-act="out" title="Alejar">−</button>
          <span class="lvl">100%</span>
          <button data-act="in" title="Acercar">+</button>
          <button data-act="fit" class="fit-btn" title="Ajustar a la vista">Ajustar</button>
          <button data-act="expand" class="fs-btn" title="Pantalla completa">Ampliar ⤢</button>
        </div>
      </div>
      <div class="viewport">
        <div class="stage"><div class="mermaid">${c.code}</div></div>
      </div>
    </div>`;
  });
  if (s.note){
    html += `<div class="card"><div class="note" style="border-top:none;padding-top:0;">${s.note}</div></div>`;
  }
  (s.tables||[]).forEach(t => {
    html += `<div class="card"><h3>${t.h}</h3><table><thead><tr>${t.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
    t.rows.forEach(r => { html += `<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`; });
    html += `</tbody></table></div>`;
  });
  sec.innerHTML = html;
  panelsEl.appendChild(sec);
});

const rendered = new Set();

async function renderSection(id){
  if (rendered.has(id)) return;
  rendered.add(id);
  const sec = document.getElementById(id);
  const nodes = sec.querySelectorAll('.mermaid');
  if (nodes.length) await mermaid.run({ nodes: Array.from(nodes) });
  sec.querySelectorAll('.card').forEach(initZoomCard);
}

function activate(id){
  document.querySelectorAll('.group button').forEach(b => b.classList.toggle('active', b.dataset.target===id));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('active', s.id===id));
  renderSection(id);
}

// ---------- Zoom / pan / ajustar / pantalla completa ----------

function initZoomCard(card){
  if (card.dataset.zoomReady) return;
  card.dataset.zoomReady = '1';

  const viewport = card.querySelector('.viewport');
  const stage = card.querySelector('.stage');
  const lvl = card.querySelector('.lvl');
  if (!viewport || !stage) return;

  let scale = 1, tx = 0, ty = 0;
  let fitScale = 1;

  function apply(){
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    if (lvl) lvl.textContent = Math.round(scale * 100) + '%';
  }

  function fit(){
    // el svg ya está en el DOM tras mermaid.run(); medir su tamaño real
    const svg = stage.querySelector('svg');
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    if (!svg || !vw || !vh) { scale = 1; tx = 0; ty = 0; apply(); return; }
    const box = svg.getBoundingClientRect();
    const naturalW = box.width / (scale || 1);
    const naturalH = box.height / (scale || 1);
    if (!naturalW || !naturalH) { scale = 1; tx = 0; ty = 0; apply(); return; }
    fitScale = Math.min(vw / naturalW, vh / naturalH, 1) * 0.94;
    scale = fitScale;
    tx = (vw - naturalW * scale) / 2;
    ty = (vh - naturalH * scale) / 2;
    apply();
  }

  function zoomBy(factor, cx, cy){
    const rect = viewport.getBoundingClientRect();
    const px = cx !== undefined ? cx - rect.left : viewport.clientWidth / 2;
    const py = cy !== undefined ? cy - rect.top : viewport.clientHeight / 2;
    const newScale = Math.min(12, Math.max(0.1, scale * factor));
    const wx = (px - tx) / scale, wy = (py - ty) / scale;
    scale = newScale;
    tx = px - wx * scale;
    ty = py - wy * scale;
    apply();
  }

  // controles
  card.querySelectorAll('.toolbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'in') zoomBy(1.25);
      else if (act === 'out') zoomBy(0.8);
      else if (act === 'fit') fit();
      else if (act === 'expand') toggleExpand(card, fit);
    });
  });

  // rueda del mouse sobre el diagrama
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomBy(e.deltaY < 0 ? 1.1 : 0.9, e.clientX, e.clientY);
  }, { passive: false });

  // arrastrar para mover
  let dragging = false, sx = 0, sy = 0, stx = 0, sty = 0;
  viewport.addEventListener('pointerdown', (e) => {
    dragging = true;
    viewport.classList.add('dragging');
    viewport.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
  });
  viewport.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    tx = stx + (e.clientX - sx);
    ty = sty + (e.clientY - sy);
    apply();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev =>
    viewport.addEventListener(ev, () => { dragging = false; viewport.classList.remove('dragging'); })
  );

  // ajuste inicial (esperar un frame para que el SVG tenga layout)
  requestAnimationFrame(() => requestAnimationFrame(fit));
}

function toggleExpand(card, fitFn){
  const expanding = !card.classList.contains('expanded');
  card.classList.toggle('expanded', expanding);
  document.body.classList.toggle('has-expanded', expanding);
  const btn = card.querySelector('[data-act="expand"]');
  if (btn) btn.textContent = expanding ? 'Cerrar ✕' : 'Ampliar ⤢';
  requestAnimationFrame(() => requestAnimationFrame(fitFn));
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const open = document.querySelector('.card.expanded');
    if (open) open.querySelector('[data-act="expand"]').click();
  }
});

// Sección visible al cargar la página
renderSection(sections[0].id);
</script>
